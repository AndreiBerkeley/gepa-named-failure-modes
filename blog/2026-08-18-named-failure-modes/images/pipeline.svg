<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" width="1040" height="360" font-family="Arial" role="img">
  <style>
    .band  { fill: #f5f6f8; }
    .card  { fill: #ffffff; stroke: #c9ccd4; stroke-width: 1.5; }
    .input { fill: #eef0fe; stroke: #4F46E5; stroke-width: 1.5; }
    .ln    { stroke: #8b909b; stroke-width: 2; fill: none; }
    .arrow { fill: #8b909b; }
    .phase { fill: #6b7280; font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    .step  { fill: #4F46E5; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
    .ttl   { fill: #1f2430; font-size: 16px; font-weight: 650; }
    .sub   { fill: #5b6270; font-size: 12.5px; }
    .lbl   { fill: #5b6270; font-size: 11.5px; font-style: italic; }
    .note  { fill: #5b6270; font-size: 12.5px; font-weight: 550; }
    @media (prefers-color-scheme: dark) {
      .band { fill: #191c27; }
      .card { fill: #1c2030; stroke: #3a4055; }
      .input { fill: #23244a; stroke: #8b8bf0; }
      .ln { stroke: #7d8494; }
      .arrow { fill: #7d8494; }
      .phase, .sub, .lbl, .note { fill: #a8aebb; }
      .step { fill: #8b8bf0; }
      .ttl { fill: #eef0f4; }
    }
  </style>
  <rect class="band" x="16" y="16" width="1008" height="328" rx="10"/>
  <text class="phase" x="40" y="43">ONE REFLECTION STEP</text>
  <text class="note" x="1000" y="43" text-anchor="end">Taxonomy learned automatically and frozen</text>

  <!-- current minibatch -->
  <rect class="card" x="40" y="92" width="220" height="154" rx="10"/>
  <text class="step" x="62" y="121">CURRENT MINIBATCH</text>
  <text class="ttl" x="62" y="150">Run current candidate</text>
  <text class="sub" x="62" y="178">Component traces</text>
  <text class="sub" x="62" y="200">Task output</text>

  <!-- LLM judge: reads the component traces -->
  <rect class="input" x="310" y="64" width="390" height="108" rx="10"/>
  <text class="step" x="332" y="90">LLM JUDGE</text>
  <text class="ttl" x="332" y="116">Findings</text>
  <text class="sub" x="332" y="138">Failure mode, step, evidence</text>
  <text class="sub" x="332" y="158">Sees no score, gold answer, or feedback</text>

  <!-- evaluator: assesses the task output -->
  <rect class="input" x="310" y="186" width="390" height="88" rx="10"/>
  <text class="step" x="332" y="212">EVALUATOR</text>
  <text class="ttl" x="332" y="238">Task feedback</text>
  <text class="sub" x="332" y="260">Feedback on the task output, plus the score</text>

  <!-- reflection -->
  <rect class="card" x="750" y="92" width="250" height="154" rx="10"/>
  <text class="step" x="772" y="121">REFLECTION</text>
  <text class="ttl" x="772" y="150">Propose revised text</text>
  <text class="sub" x="772" y="178">Judge's findings</text>
  <text class="sub" x="772" y="200">Evaluator feedback</text>
  <text class="sub" x="772" y="222">Current candidate</text>

  <!-- inputs: component traces -> judge, task output -> evaluator -->
  <path class="ln" d="M262,173 H286 V118 H297"/>
  <path class="arrow" d="M297,113 L307,118 L297,123 Z"/>
  <path class="ln" d="M262,195 H286 V230 H297"/>
  <path class="arrow" d="M297,225 L307,230 L297,235 Z"/>

  <!-- outputs: findings and feedback -> reflection -->
  <path class="ln" d="M702,118 H726 V173 H737"/>
  <path class="arrow" d="M737,168 L747,173 L737,178 Z"/>
  <text class="lbl" x="714" y="108" text-anchor="middle">findings</text>
  <path class="ln" d="M702,230 H726 V195 H737"/>
  <path class="arrow" d="M737,190 L747,195 L737,200 Z"/>
  <text class="lbl" x="714" y="246" text-anchor="middle">feedback</text>

  <!-- score -> candidate acceptance -->
  <path class="ln" d="M505,276 V293"/>
  <path class="arrow" d="M500,293 L505,303 L510,293 Z"/>
  <text class="lbl" x="513" y="292">score</text>

  <rect class="card" x="40" y="305" width="960" height="25" rx="7"/>
  <text class="note" x="520" y="322" text-anchor="middle">Candidate acceptance is unchanged: GEPA compares task scores on the same minibatch.</text>
</svg>
