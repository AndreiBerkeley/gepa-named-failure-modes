[project]
name = "gepa-taxonomy-experiments"
version = "0.1.0"
description = "Experiment orchestration for taxonomy-conditioned GEPA (configs, split manifests, run scripts, results)"
requires-python = ">=3.12"
dependencies = [
    # litellm signs Bedrock-routed calls through botocore.
    "boto3>=1.43.67",
    "datasets>=5.0.1",
    # gepa is pinned to the exact baseline release; see docs/findings/phase0-gepa-pin.md
    "gepa==0.1.4",
    "litellm>=1.95.0",
    # litellm imports tenacity lazily inside its retry wrapper; without this
    # pin, reflection fails at runtime with a bare ImportError.
    "tenacity>=8.0",
    "emoji>=2.15.0",
    "nltk>=3.10.3",
    "syllapy>=0.8.0",
    "immutabledict>=4.3.1",
    "langdetect>=1.0.9",
    "absl-py>=2.5.0",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# SWE-bench evaluation harness. Kept optional: it pulls docker/modal and is only
# needed on a machine that actually runs the evaluation harness.
[project.scripts]
gepa-taxonomy = "gepa_taxonomy.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# failure_taxonomy is the PR-bound package: benchmark-agnostic, depends only on
# gepa, and carries no experiment orchestration (CLAUDE.md hard rule 4).
packages = ["src/gepa_taxonomy", "src/failure_taxonomy"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Intentional, each with a comment at the call site:
#   BLE001/S110 - cost.py falls back to litellm then raises UnpricedModelError
#   B017        - frozen+slots raises TypeError for new attrs, not a fixed class
#   PLW1510     - smoke_eval inspects the return code itself
ignore = ["BLE001", "S110", "B017", "PLW1510", "ISC004"]
